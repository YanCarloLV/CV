name: Compilar APK

on:
  push:
    paths:
      - 'smart-iptv-tv.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip -q smart-iptv-tv.zip -d proj

      - name: Compilar
        working-directory: proj
        run: |
          set +e
          gradle --no-daemon assembleDebug > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "## Errores de compilacion"
              echo '```'
              grep -E "^e: |^w: .*error|error:|What went wrong|Could not|Execution failed|Caused by|FAILURE" ../build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(grep -E "^e: |error:|What went wrong|Could not|Execution failed|Caused by" ../build.log | head -20 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=Fallo la compilacion::${msg}"
          fi
          exit $code

      - name: Copiar APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk smart-iptv-mx.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Smart IPTV MX (ultima version)
          files: smart-iptv-mx.apk
